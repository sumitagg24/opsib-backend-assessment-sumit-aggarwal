# Alembic Configuration

[alembic]
script_location = alembic
prepend_run_to_context = true
prepend_sys_path = .

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
date_format = %H:%M:%S

# Database URL - will be overridden by env variable
sqlalchemy.url = postgresql://opsib:opsib@localhost:5432/opsib
